name: Crear mod HeavyCore

on:
  workflow_dispatch:
  push:
    paths:
      - 'heavycore-autoclicker.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Descomprimir mod
        run: unzip -q heavycore-autoclicker.zip

      - name: Compilar mod
        run: gradle build --no-daemon
        working-directory: heavycore-autoclicker

      - name: Guardar archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: HeavyCore-AutoClicker-JAR
          path: heavycore-autoclicker/build/libs/*.jar
